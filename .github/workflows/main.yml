name: ETL Pipeline

on:
  push:
    branches:
      - main
jobs:
  extract-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run Extract Job
        run: python extract.py

  transform-job:
    needs: extract-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: Run Transform Job
        run: python transform.py
  load-job:
    needs: transform-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: Run Load Job
        run: python load.py
